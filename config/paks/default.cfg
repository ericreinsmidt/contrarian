# Contrarian / minarch defaults.
#
# This file exists mostly so that it EXISTS. minarch's Config_init() opens:
#
#     if (!config.default_cfg || config.initialized) return;
#
# and Config_init() is what builds the VALUE LISTS for the shader options and
# the overlay option. config.default_cfg is read from the path getEmuPath()
# derives -- PAKS_PATH/Emus/<tag>.pak/default.cfg -- which Contrarian otherwise has
# no reason to have, since it ships no paks. Without this file that function
# returns immediately, both lists stay empty, and every "minarch_shader1 = ..."
# or "minarch_overlay = ..." in a per-game config silently resolves to index 0
# (the first entry: "None"). No error, no warning.
#
# THE PATH MATTERS, in two ways. PAKS_PATH is SYSTEM_PATH "/paks", and
# SYSTEM_PATH is a COMPILE-TIME macro, /mnt/SDCARD/.system/<platform> -- the
# SYSTEM_PATH env var Contrarian exports has no effect on it, the same trap as
# SHADERS_FOLDER and OVERLAYS_FOLDER. And getEmuPath's fallback is
#
#     sprintf(pak_path, "%s/Emus/%s.pak/launch.sh", PAKS_PATH, emu_name);
#
# so there is an "Emus" component INSIDE the paks folder. The full path is
# /mnt/SDCARD/.system/tg5040/paks/Emus/Contra.pak/default.cfg.
#
# No "bind" lines: minarch's built-in control defaults are already correct, and
# any bind here would override them.
