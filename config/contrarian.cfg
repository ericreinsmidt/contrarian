# The only settings file. There is deliberately almost nothing in it.
# brightness=  0..10, applied at boot (before the boot animation)
# volume=      0..100, applied at boot
brightness=8
volume=60

# wifi=1 keeps WiFi up so the device stays reachable over SSH. Off by default:
# there is nothing for this device to connect to. A `.devwifi` marker file in
# Contrarian/ forces it on too, for development units.
wifi=0

# view= which presentation to use. X cycles it in the launcher and writes the
# choice back here.
#   room       one television on shag carpet; versions are channels and the
#              d-pad turns the UHF dial (a rejected ROM simply does not come in)
#   coverflow  a shelf of televisions, scrolled
view=room
